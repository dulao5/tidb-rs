# ---------------------------------------------------------------- 不建 crate 的块
# --blocks 检查时，P1–P5 与 EXC 的块必须在上面登记，或列在这里并写明原因。
[unassigned]
blocks = [
  "EXC.B",   # 例外 B：cascades、代价模型 v1、静态分区，不移植
  "D00.3",   # util/*：按需整文件移植，每个文件放进用到它的最底层 crate（N0 §3）
]
phases = ["P1", "P2", "P3", "P4", "P5", "EXC", "DONE"]

# ---------------------------------------------------------------- legacy（PoC）
# 被移植代码逐步替换；新代码不得依赖。与规划中的 crate 同名的 5 个已改名为 poc-*，
# 移到 crates/poc/ 下（N0 §5）。
[legacy]
crates = [
  "poc-server", "tidb-mysql-protocol", "poc-kv", "tidb-meta", "tidb-distsql", "tidb-sql",
  "poc-executor", "poc-session", "poc-domain", "tidb-query-smoke", "tidb-ab",
]

# ---------------------------------------------------------------- third_party（ADR 0007）
# third_party/ 下的包（vendored TiKV crate 及其 shim）按路径识别，不在此登记。
# 它们只复用字节格式；layered crate 要使用，必须在这里列出，并在 PR 中说明理由。
[third_party.users]
# codec / tidb_query_datatype: dev-dependencies only, the byte-for-byte TiKV oracle of
# crates/codec/tests/tikv_oracle.rs (D01.8 spec §2: L1 port, TiKV as a test oracle).
tidb-codec = ["codec", "tidb_query_datatype"]
# tablecodec / rowcodec: dev-dependencies only, the TiKV oracle of crates/tablecodec/tests/tikv_oracle.rs
# (D01.11 spec §2). collections: TiKV's FxHashSet in cut_row's signature.
tidb-tablecodec = ["codec", "tidb_query_datatype", "collections"]
