# crate 分层表（N0，specs/exceptions/N0-crate-layering/spec.md）。
#
# 每个 workspace 成员必须在这里登记。scripts/check_layers.py 在 CI 中按本表检查
# `cargo metadata` 的依赖（含 dev / build 依赖）：
#   - layered crate 只能依赖 rank 严格更小的 layered crate（不允许同层、不允许向上）；
#   - layered crate 不能依赖 legacy crate；
#   - third_party crate 只能被 `users` 中列出的 crate 依赖；
#   - legacy crate 不受方向约束（可以依赖 layered crate，以便逐步换上移植代码）。
#
# 规划中的 crate（planned = true）还没有建立，只用来固定位置；建立时去掉 planned。
# blocks 是 tracker data/blocks.tsv 中的功能块 ID，每个块恰好属于一个 crate。

# ---------------------------------------------------------------- layered
[crate.tidb-base]
rank = 0
blocks = ["D00.2", "D00.4"]   # parser/mysql 常量、errno、terror、dbterror、config；contextutil（D00.4）

[crate.tidb-metrics]
rank = 0
blocks = ["D14.1"]

[crate.tidb-parser]
rank = 1
blocks = ["D02.1", "D02.2", "D02.3"]   # D02.3: parser model/types/auth/duration（忠实移植）

[crate.tidb-memory]
rank = 1
blocks = ["D15.1", "D15.3"]   # A1; D15.3: memory part of util/cgroup

# N3 runtime: ExecPool and topologies, checkpoint time slice, poll-stall detection, Q1
# admission (util/tokenlimiter.go, a D00.3 file), Q2 per-store window (its type must be
# below every crate that carries ExecCtx), Q3 blocking pool. No Go block of its own.
[crate.tidb-runtime]
rank = 1
blocks = []

[crate.tidb-types]
rank = 2
