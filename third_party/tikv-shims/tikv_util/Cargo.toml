[package]
name = "tikv_util"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Shim: minimal subset of TiKV tikv_util needed by tidb_query_* crates"

[lib]
# The files copied from TiKV keep their unit tests and libtest benches, which
# need TiKV dev-dependencies and a nightly compiler. They are tested upstream.
test = false
doctest = false

[dependencies]
byteorder = "1.2"
codec = { workspace = true }
error_code = { workspace = true }
thiserror = "1.0"
slog = { workspace = true }
slog-global = { workspace = true }
time = { workspace = true }
either = "1"
log_wrappers = { workspace = true }
