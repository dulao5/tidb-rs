[package]
name = "codec"
version = "0.0.1"
edition = "2021"
publish = false
license = "Apache-2.0"

[features]
# Compile the libtest benchmarks, which require a nightly compiler.
nightly = []

[dependencies]
byteorder = "1.2"
error_code = { workspace = true }
libc = "0.2"
static_assertions = "1.0"
thiserror = "1.0"
tikv_alloc = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
panic_hook = { workspace = true }
protobuf = "2"
rand = "0.8"
