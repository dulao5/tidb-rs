[package]
name = "tidb_query_common"
version = "0.0.1"
edition = "2021"
publish = false
description = "Common utility of a query engine to run TiDB pushed down executors"
license = "Apache-2.0"

[features]
# The storage abstraction, scanner and metrics used by the TiKV coprocessor.
coprocessor = [
  "dep:api_version",
  "dep:async-trait",
  "dep:futures",
  "dep:kvproto",
  "dep:prometheus",
  "dep:prometheus-static-metric",
  "dep:raft",
  "dep:tracker",
  "dep:yatp",
]

[dependencies]
anyhow = "1.0"
api_version = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
derive_more = "0.99.3"
error_code = { workspace = true }
futures = { version = "0.3", optional = true }
kvproto = { workspace = true, optional = true }
lazy_static = "1.3"
log_wrappers = { workspace = true }
prometheus = { version = "0.13", features = ["nightly"], optional = true }
prometheus-static-metric = { version = "0.5", optional = true }
raft = { workspace = true, optional = true }
serde_json = "1.0"
thiserror = "1.0"
tikv_util = { workspace = true }
time = { workspace = true }
tracker = { workspace = true, optional = true }
yatp = { workspace = true, optional = true }

[dev-dependencies]
byteorder = "1.2"
