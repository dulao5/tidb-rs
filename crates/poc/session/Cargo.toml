[package]
name = "poc-session"
version = "0.0.0"
description = "SQL sessions of the read-only node: SessionFactory/SessionHandler over the planner and executors"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
parking_lot = "0.12"
futures = { workspace = true }
tidb-distsql = { workspace = true }
poc-domain = { workspace = true }
poc-executor = { workspace = true }
poc-kv = { workspace = true }
tidb-meta = { workspace = true }
tidb-metrics = { workspace = true }
tidb-mysql-protocol = { workspace = true }
tidb-sql = { workspace = true }
tokio = { workspace = true }
# The VS1 router (glue, VS1-02): the AST it checks, the new session, its variables, the
# boundary-stub error, the ported function registry.
tidb-base = { workspace = true }
tidb-expression = { workspace = true }
tidb-parser = { workspace = true }
tidb-session = { workspace = true }
tidb-store = { workspace = true }
# Result encoding and binary parameters of the new stack (D03.1 part 1).
tidb-server = { workspace = true }
# The ported domain the new sessions take their InfoSchema from (D06.5 part 1).
tidb-domain = { workspace = true }
# The instance plan cache of the domain (planner/core's init registers its constructor);
# also a prepared statement registered in the real new session (router test of EXECUTE).
tidb-planner = { workspace = true }
# ADMIN FLUSH ... PLAN_CACHE (the executor's statement scope).
tidb-executor = { workspace = true }
tidb-sessionctx = { workspace = true }
# The ExecPool the new sessions' executors start their tasks on (N3).
tidb-runtime = { workspace = true }

[dev-dependencies]
tidb-distsql = { workspace = true }
# The tidb_rc_read_check_ts error of the new stack (router test, N11 D11).
tidb-sessiontxn = { workspace = true }
tokio = { workspace = true }
# An InfoSchema with sbtest1 for the real new session (router tests).
tidb-infoschema = { workspace = true }
tidb-model = { workspace = true }

[lints]
workspace = true
