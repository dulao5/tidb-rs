[package]
name = "poc-kv"
version = "0.0.0"
description = "Thin snapshot-read wrapper over tikv-client: TSO, point gets, scans and coprocessor requests"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures = { workspace = true }
thiserror = { workspace = true }
tikv-client = { workspace = true }
tokio = { workspace = true }
# TIDB_RS_POINT_GET=d07.1: point gets through the ported store driver (D07.1, VS1-18), for
# the fault-scenario comparison (tools/ab/faults).
tidb-base = { workspace = true }
tidb-kv = { workspace = true }
# The coprocessor client (D07.2): cop reads go through `tidb_store::copr`.
tidb-runtime = { workspace = true }
tidb-store = { workspace = true }

[lints]
workspace = true
