[package]
name = "poc-domain"
version = "0.0.0"
description = "Go-TiDB-style schema sync: etcd registration, background schema reloads, the MDL protocol and the in-flight statement registry"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# etcd v3 client for PD's embedded etcd (server info, schema versions, MDL reports). 0.14 is
# the release built on tonic 0.12 / prost 0.13, the versions tikv-client already uses.
etcd-client = "0.14"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tidb-distsql = { workspace = true }
poc-executor = { workspace = true }
poc-kv = { workspace = true }
tidb-meta = { workspace = true }
tidb-mysql-protocol = { workspace = true }
tidb-sql = { workspace = true }
tokio = { workspace = true }
# D05.2 PR C: the SET GLOBAL writer (layered) and its I/O here.
tidb-systable = { workspace = true }
tidb-base = { workspace = true }
tidb-model = { workspace = true }
tikv-client = { workspace = true }
parking_lot = "0.12"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# examples/systable_cli.rs (raw).
tidb-tablecodec = { workspace = true }
tidb-types = { workspace = true }

[lints]
workspace = true
