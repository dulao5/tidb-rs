[package]
name = "poc-domain"
version = "0.0.0"
description = "Go-TiDB-style schema sync: etcd registration, background schema reloads, the MDL protocol and the in-flight statement registry"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# etcd v3 client for PD's embedded etcd (server info, schema versions, MDL reports). 0.14 is
# the release built on tonic 0.12 / prost 0.13, the versions tikv-client already uses.
etcd-client = "0.14"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tidb-distsql = { workspace = true }
poc-executor = { workspace = true }
poc-kv = { workspace = true }
tidb-meta = { workspace = true }
tidb-mysql-protocol = { workspace = true }
tidb-sql = { workspace = true }
tokio = { workspace = true }
# D05.2 PR C: the SET GLOBAL writer (layered) and its I/O here.
tidb-systable = { workspace = true }
tidb-base = { workspace = true }
tidb-model = { workspace = true }
# D04.1 Part 5: cluster mysql.* privilege table loading and etcd /tidb/privilege reload.
tidb-parser = { workspace = true }
tidb-privilege = { workspace = true }
tidb-tablecodec = { workspace = true }
tidb-types = { workspace = true }
# The ported domain (D06.5 part 1) and the kv.Storage it reads through (ported_domain.rs).
tidb-domain = { workspace = true }
tidb-kv = { workspace = true }
tikv-client = { workspace = true }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# examples/meta_cli.rs (D06.2 mixed-cluster check).
tidb-infoschema = { workspace = true }
# privilege_loader.rs unit tests (common-handle key encoding).
tidb-codec = { workspace = true }
# examples/systable_cli.rs (raw).
tidb-tablecodec = { workspace = true }
tidb-types = { workspace = true }

[lints]
workspace = true
