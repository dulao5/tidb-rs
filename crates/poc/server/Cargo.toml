[package]
name = "poc-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# N0 §5: the package is poc-server, the binary keeps its name.
[[bin]]
name = "tidb-server"
path = "src/main.rs"

[dependencies]
bytes = { workspace = true }
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "tokio"] }
serde_json = { workspace = true }
# gostd::time::parse_duration for --lease (Go's duration flag syntax).
tidb-base = { workspace = true }
tidb-distsql = { workspace = true }
poc-domain = { workspace = true }
poc-kv = { workspace = true }
# rpc.rs: the kvproto messages of the status-port gRPC services (prost, as tikv-client's).
prost = "0.13"
# rpc.rs: tipb (rust-protobuf) DAG requests and select responses.
protobuf = { workspace = true }
tipb = { workspace = true }
tidb-meta = { workspace = true }
tidb-metrics = { workspace = true }
tidb-mysql-protocol = { path = "../../mysql-protocol" }
poc-session = { workspace = true }
# N3 runtime: ExecPool, statement admission, stall detection.
tidb-runtime = { workspace = true }
tikv-jemallocator = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
# "tracing-log": `init()` also installs a LogTracer, so crates that log through the `log` facade
# (tidb-base terror/config, tidb-types collate/time, tidb-parser gocharset, ...) reach this
# subscriber. Without it their records were dropped (PR #18 review).
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std", "tracing-log"] }

[dev-dependencies]
# status.rs tests: an HTTP/2 client for the gRPC routing.
hyper = { version = "1", features = ["client", "http2"] }

[lints]
workspace = true
