[package]
name = "tidb-executor"
version = "0.0.0"
description = "Port of Go TiDB v8.5.8 pkg/executor (blocks D12.x): the executor framework of D12.0 (VS1-13) on the async executor interface of N3; the executors come with the VS1 work items"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Boxed futures for `dyn Executor` (N3 §3.1 item 1: one boxed future per Next).
async-trait = { workspace = true }
# Errors (M-ERR).
tidb-base = { workspace = true }
# Chunk (D01.7, N5a).
tidb-chunk = { workspace = true }
# StatementContext carried by ExecCtx (N2).
tidb-sessionctx = { workspace = true }
# Physical plans the builder turns into executors (N1).
tidb-planner = { workspace = true }
# VS1-13 (D12.0): schemas, field types and names, runtime stats, the SQL killer, the info
# schema of ExecStmt, the parser AST, the DAG request types, the prepared statement cache lock.
tidb-expression = { workspace = true }
tidb-parser = { workspace = true }
tidb-types = { workspace = true }
tidb-execdetails = { workspace = true }
tidb-memory = { workspace = true }
tidb-model = { workspace = true }
tidb-infoschema = { workspace = true }
tipb = { workspace = true }
# The boxed future of SessionContext::get_stmt_read_ts (the provider waits for the TSO).
futures = { workspace = true }
parking_lot = "0.12"
log = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
