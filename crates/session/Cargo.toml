[package]
name = "tidb-session"
version = "0.0.0"
description = "Port of Go TiDB v8.5.8 pkg/session (block D05.3): the protocol-neutral session of N2 / ADR 0010; ExecuteStmt, LazyTxn and the transaction manager (VS1-14)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Errors (M-ERR), boundary stubs.
tidb-base = { workspace = true }
# Unified logging types (ContextLogger / OwnedLogField) for expensive_query (rank 1 < rank 15).
tidb-log = { workspace = true }
# Execution statistics (ExecDetails / CopTasksDetails) for expensive_query (rank 4 < rank 15).
tidb-execdetails = { workspace = true }
# The AST the session executes (ADR 0010 §4.2: the only boundary to the semantic core).
tidb-parser = { workspace = true }
# SessionVars, StatementContext (D05.2, D00.1).
tidb-sessionctx = { workspace = true }
# Datum parameters.
tidb-types = { workspace = true }
# Planner and executors (VS1-10…VS1-15).
tidb-planner = { workspace = true }
tidb-executor = { workspace = true }
# The transaction context providers (D05.4).
tidb-sessiontxn = { workspace = true }
# kv.Storage / kv.Transaction (D07.0), the coprocessor client's variables (D07.2).
tidb-kv = { workspace = true }
tidb-store = { workspace = true }
tidb-infoschema = { workspace = true }
tidb-chunk = { workspace = true }
# The SQL killer (N2 SessionShared).
tidb-memory = { workspace = true }
# The ExecPool the executors' tasks run on (N3).
tidb-runtime = { workspace = true }
futures = { workspace = true }
parking_lot = "0.12"
log = "0.4"

[dev-dependencies]
tidb-model = { workspace = true }
# Rows of the mock store (the point get executor reuse tests).
tidb-tablecodec = { workspace = true }
tidb-codec = { workspace = true }
tidb-expression = { workspace = true }
# The pseudo statistics table the plan replayer capture records.
tidb-statistics = { workspace = true }
tidb-executor = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt"] }
flate2 = "1.0"
serde_json = { workspace = true }
tipb = { workspace = true }
protobuf = { workspace = true }

[lints]
workspace = true
