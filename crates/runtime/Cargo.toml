[package]
name = "tidb-runtime"
version = "0.0.0"
description = "Execution runtime skeleton of tidb-rs (N3): ExecPool and topologies, time-sliced checkpoints, poll-stall detection, Q1 statement admission, Q2 per-store in-flight windows, Q3 blocking pool"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# A recovered panic whose payload is a tidb error (Go `panic(err)`) keeps its text.
tidb-base = { workspace = true }
# The one runtime of the process (N3 3.1); tikv-client is on tokio too.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
# Go sync.Mutex / RWMutex (mapping rule M-LOCK).
parking_lot = "0.12"
# Same version as tidb-metrics, tidb_query_common and tikv-client: one default registry.
prometheus = { version = "0.13", default-features = false }
# Panic, stall and store-token warnings (Go: logutil.BgLogger(), i.e. zap). `tracing`, like
# tidb-server's subscriber, so they reach the server log without a log -> tracing bridge.
tracing = "0.1"
# Thread CPU time and per-thread rusage for stall classification (safe wrappers; the crate
# forbids unsafe). Same version as tidb-metrics.
nix = { version = "0.29", default-features = false, features = ["time", "resource"] }

[dev-dependencies]
# Captures the runtime's tracing events in tests (tests/logs.rs).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
criterion = "0.5"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }

[[bench]]
name = "overhead"
harness = false

[lints]
workspace = true
