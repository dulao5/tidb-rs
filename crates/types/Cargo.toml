[package]
name = "tidb-types"
version = "0.0.0"
description = "Port of Go TiDB v8.5.8 pkg/types (blocks D01.2 MyDecimal, D01.3 time, D01.6 vector, D01.9 collation)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Errors (M-ERR), Go fmt and the Go time package (time.Location, time.Time).
tidb-base = { workspace = true }
# pkg/parser/charset (block D02.2): collation registry and the GBK encoder of gbk_bin.
tidb-parser = { workspace = true }

[dev-dependencies]
# Whole-line log parity golden tests for rank 1-2 crates (tidb-parser, tidb-memory,
# tidb-runtime, tidb-types): tidb-memory/tidb-runtime share rank 1 with tidb-log so their
# real-encoder golden tests live here (rank 2 > rank 1, check_layers.py).
tidb-log = { workspace = true }
tidb-memory = { workspace = true }
tidb-runtime = { workspace = true }
# The govec replay tests read the JSON records (test code only; the crate's own JSON decoding
# is tidb-base's port of Go encoding/json).
serde_json = { workspace = true }
criterion = "0.5"
# The govec vectors are committed as .jsonl.gz.
flate2 = "1.0"
# govec collate: the key digests over all code points (SHA-256, as the Go generator).
sha2 = "0.10"
# Benchmarks run on the server's allocator.
tikv-jemallocator = { workspace = true }

[[bench]]
name = "mydecimal"
harness = false

[lints]
workspace = true

[[bench]]
name = "json"
harness = false

[[bench]]
name = "datum"
harness = false
