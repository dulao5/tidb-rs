[package]
name = "tidb-infoschema"
version = "0.0.0"
description = "Blocks D06.2-D06.4, D06.6 of the Go TiDB v8.5.8 port: meta / structure reads (D06.2), InfoSchema v2 build and cache (D06.3), the table abstraction read path (D06.4), later memory tables"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Errors (M-ERR), errno, dbterror classes, gofmt, gostd strconv.
tidb-base = { workspace = true }
# model.CIStr, parser/mysql constants.
tidb-parser = { workspace = true }
# strconv.ParseFloat (gostd, Go's syntax and NaN).
tidb-types = { workspace = true }
# DBInfo / TableInfo / Job / SchemaDiff / PolicyInfo / ResourceGroupInfo and their Go JSON (D06.1).
tidb-model = { workspace = true }
# kv.Retriever / Snapshot / Key / ErrNotExist (D07.0).
tidb-kv = { workspace = true }
# util/codec EncodeBytes / EncodeUint / EncodeInt (D01.8).
tidb-codec = { workspace = true }
# The regexps of GetAllNameToIDAndTheMustLoadedTableInfo (Go regexp, RE2 semantics).
regex = "1"
# tidb_schema_cache_size (SchemaCacheSize), the MetaOnlyInfoSchema stand-in (D06.3).
tidb-sessionctx = { workspace = true }
# Go sync.Mutex / RWMutex (mapping rule M-LOCK): the infoschema v2 indexes and the SIEVE cache.
parking_lot = "0.12"
# BoxFuture / Shared: ApplyDiff's recursion, loadTableInfo's singleflight.
futures = { workspace = true }
# The 200 ms waits of the "in flashback progress" retries (time.Sleep).
tokio = { workspace = true, features = ["time"] }
# logutil.BgLogger().Error of the bundle builder.
log = "0.4"
# Table abstraction (D06.4): column casts and defaults (CastColumnValue, GetTimeValue),
# expression.Column of virtual columns, BuildContext.
tidb-expression = { workspace = true }
# chunk.Chunk of FillVirtualColumnValue (D01.7).
tidb-chunk = { workspace = true }
# Record / index prefixes and keys, raw row decoding, Unflatten, EncodeValue (D01.11).
tidb-tablecodec = { workspace = true }
# tipb.TableScan / ColumnInfo of BuildTableScanFromInfos and SetPBColumnsDefaultValue.
tipb = { workspace = true }

[dev-dependencies]
# The govec vectors are committed as .jsonl.gz.
flate2 = "1.0"
# tipb.TableScan bytes of the table vectors.
protobuf = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
