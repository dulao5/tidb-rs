[package]
name = "tidb-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes = { workspace = true }
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "tokio"] }
serde_json = { workspace = true }
tidb-distsql = { workspace = true }
tidb-domain = { workspace = true }
tidb-kv = { workspace = true }
tidb-meta = { workspace = true }
tidb-metrics = { workspace = true }
tidb-mysql-protocol = { path = "../mysql-protocol" }
tidb-session = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std"] }

[lints]
workspace = true
