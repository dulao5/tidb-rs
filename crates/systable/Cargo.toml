[package]
name = "tidb-systable"
version = "0.0.0"
description = "Block D06.7 of the Go TiDB v8.5.8 port: the system-table writes behind SET GLOBAL (REPLACE INTO mysql.global_variables / mysql.tidb, the row-ID allocator's alloc4Signed, the sysvar cache rebuild), as pure logic over a snapshot; the I/O is done by the caller"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Errors (M-ERR), errno, dbterror classes, gostd time zones.
tidb-base = { workspace = true }
# Datum, collations.
tidb-types = { workspace = true }
# FieldType.
tidb-parser = { workspace = true }
# model.TableInfo / IndexInfo / ColumnInfo (block D06.1).
tidb-model = { workspace = true }
# kv.Handle (block D07.0).
tidb-kv = { workspace = true }
# Record and index keys and values, row format v2 (block D01.11).
tidb-tablecodec = { workspace = true }
# The sysvar registry and SessionVars (rebuildSysVarCache runs the SetGlobal hooks).
tidb-sessionctx = { workspace = true }
# Go sync.RWMutex / sync.Mutex of the sysvar cache.
parking_lot = "0.12"

[dev-dependencies]
# The govec vectors are committed as .jsonl.gz.
flate2 = "1.0"
serde_json = { workspace = true }

[lints]
workspace = true
