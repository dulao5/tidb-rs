[package]
name = "tidb-parser"
version = "0.0.0"
description = "TiDB SQL parser: TiDB's parser.y on a build-time LR table generator and a small custom LR driver"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Errors (M-ERR), Go fmt, encoding/json, strings.ToLower and the mysql constants (N0 rank 0).
tidb-base = { workspace = true }
log = "0.4"

[build-dependencies]
# Only used at build time, to compute the LR automaton from grammar/tidb_typed.y.
cfgrammar = "0.15"
lrtable = "0.15"

[dev-dependencies]
serde_json = "1"
# The govec vectors are committed as .jsonl.gz.
flate2 = "1.0"

[lints]
workspace = true
