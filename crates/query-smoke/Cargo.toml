[package]
name = "tidb-query-smoke"
version = "0.0.0"
description = "Tests against the vendored TiKV query crates: smoke tests, and the coprocessor evaluation oracle (local evaluation vs TiKV's evaluator for push-down expressions)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
tidb_query_datatype = { workspace = true }
tidb_query_expr = { workspace = true }
tipb = { workspace = true }
tipb_helper = { workspace = true }
# The coprocessor evaluation oracle (tests/copr_eval_oracle.rs): tidb-rs builds and evaluates
# an expression locally, converts it to tipb as a push-down does, and TiKV's evaluator runs it.
tidb-base = { workspace = true }
tidb-types = { workspace = true }
tidb-parser = { workspace = true }
tidb-chunk = { workspace = true }
tidb-codec = { workspace = true }
tidb-kv = { workspace = true }
tidb-sessionctx = { workspace = true }
tidb-expression = { workspace = true }
tidb-expr-pushdown = { workspace = true }
protobuf = { workspace = true }
# Decoding TiKV's chunk-format result with the ported chunk codec.
bytes = { workspace = true }

[lints]
workspace = true
