[package]
name = "tidb-mysql-protocol"
version = "0.0.0"
description = "MySQL wire-protocol server layer (handshake, auth, commands, result encoding) for tidb-rs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
sha1 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tracing = "0.1"

[dev-dependencies]
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "ring", "rustls-tls", "tls12"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
