name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # grpcio-sys 0.10 bundles gRPC 1.44 / abseil, whose headers use uint8_t
  # without <cstdint>; GCC 13 (ubuntu-24.04) no longer pulls it in
  # transitively, so the gRPC build fails. Force-include it.
  CXXFLAGS: -include cstdint

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at 10x Linux minutes; macOS is checked locally
        # before merge instead. Add macos-latest back here to re-enable it.
        # Pinned: ubuntu-latest moved to a new image whose apt mirrors fail to resolve
        # (2026-11-11, "Temporary failure resolving archive.ubuntu.com"); the arm job
        # already uses ubuntu-24.04-arm.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Native build dependencies of the vendored TiKV crates:
      # - tipb -> grpcio-sys builds gRPC C++ with CMake (needs a C++ compiler,
      #   cmake; CMAKE_POLICY_VERSION_MINIMUM is set in .cargo/config.toml).
      # - tipb's build script runs protoc (>= 3.1); without one in PATH it
      #   builds protoc from source, which is slow and needs autotools.
      # - tidb_query_expr -> openssl-sys (system OpenSSL), flate2 -> libz-sys.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # The Azure apt mirror has been failing to resolve on the amd64 runners
        # (2026-11-11, both ubuntu-latest and ubuntu-24.04). The compilers, cmake,
        # pkg-config and the OpenSSL / zlib headers are preinstalled on the GitHub
        # images, so apt is best effort (with retries); protoc, the one package the
        # images lack, falls back to the official release binary.
        run: |
          sudo apt-get -o Acquire::Retries=5 update || echo "::warning::apt-get update failed"
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev zlib1g-dev protobuf-compiler \
            || echo "::warning::apt-get install failed"
          if ! command -v protoc >/dev/null; then
            v=29.3
            curl -fsSL --retry 5 -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-linux-x86_64.zip"
            # sha256 of protoc-29.3-linux-x86_64.zip; a replaced or tampered asset fails CI.
            echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  /tmp/protoc.zip" | sha256sum -c -
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          fi
          protoc --version
          pkg-config --modversion openssl zlib
      # CMake and Xcode's clang ship with the macOS runner image.
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt, clippy).
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Versions
        run: |
          rustc --version
          cargo --version
          cmake --version | head -n 1
          protoc --version

      # N0: crate layering (layers.toml). Fails on upward / same-rank / legacy dependencies.
      - name: crate layering
        run: python3 scripts/check_layers.py

      # N13 §3 rule 3: no interior mutability (Cell / Mutex / atomics ...) in the shared
      # metadata types (crates/model/src, FieldType); reviewed exceptions carry
      # `// N13-allow: <reason>`. The script's own tests run first.
      - name: model interior mutability
        run: |
          python3 scripts/test_check_model_mutability.py
          python3 scripts/check_model_mutability.py

      - name: weekly report verdicts, fault error classification
        run: |
          python3 tools/weekly/test_report.py
          python3 tools/ab/faults/test_faults.py

      - name: rustfmt (first-party crates)
        run: cargo fmt --check $(tools/first-party.sh)

      - name: clippy (first-party crates)
        run: cargo clippy --no-deps --all-targets --locked $(tools/first-party.sh) -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      # Go-ported crates again, optimised but with integer overflow checks (profile
      # release-checked): vector replay plus a few minutes of the overflow fuzz. A Go
      # wrap that is not written wrapping_* (M-INT) panics here.
      # Replays that read the process time zone (column defaults of TIMESTAMP columns with
      # version 0 use the system location) also run in a non-UTC zone (#217 review).
      - name: test (govec_table, non-UTC TZ)
        if: runner.os == 'Linux'
        env:
          TZ: America/Sao_Paulo
        run: cargo test --locked -p tidb-infoschema --test govec_table
      - name: test (release-checked, Go-ported crates)
        env:
          TIDB_TYPES_FUZZ_ITERS: "500000000"
          # fuzz_json (A4 §6.3): about 5 s per 300,000 iterations.
          TIDB_TYPES_FUZZ_JSON_ITERS: "300000"
        run: cargo test --profile release-checked --locked -p tidb-types -p tidb-memory -p tidb-chunk -p tidb-kv -p tidb-codec -p tidb-sessionctx -p tidb-tablecodec -p tidb-systable -p tidb-expression -p tidb-expr-pushdown -p tidb-execdetails -p tidb-infoschema -p tidb-store -p tidb-sessiontxn

  # The Go vectors depend on the target (mapping rule M-FMA: gc fuses some float
  # multiply-adds into FMA on arm64 and not on amd64 GOAMD64=v1). The check job
  # (x86_64) replays vectors/v8.5.8/amd64; this job replays vectors/v8.5.8/arm64
  # on an aarch64 runner. tidb-types only builds C code (jemalloc for the bench, miniz)
  # that the runner image's compiler handles; none of the TiKV native deps.
  types-arm64:
    name: Go-ported crates (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --locked -p tidb-types -p tidb-base -p tidb-memory -p tidb-parser -p tidb-model -p tidb-chunk -p tidb-kv -p tidb-codec -p tidb-sessionctx -p tidb-tablecodec -p tidb-systable -p tidb-expression -p tidb-expr-pushdown -p tidb-execdetails -p tidb-infoschema -p tidb-store -p tidb-sessiontxn
      - name: test (release-checked)
        run: cargo test --profile release-checked --locked -p tidb-types -p tidb-memory -p tidb-chunk -p tidb-kv -p tidb-codec -p tidb-sessionctx -p tidb-tablecodec -p tidb-systable -p tidb-expression -p tidb-expr-pushdown -p tidb-execdetails -p tidb-infoschema -p tidb-store -p tidb-sessiontxn
