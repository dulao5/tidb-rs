# ---- 例外 A3 plan cache（负责人决定 2026-11-23，#305；docs/compatibility.md "Plan cache (exception A3)"，已决定、未实现）----

[[ruling]]
id = "R14"
name = "instance-plan-cache-default-on"
class = "divergence"
plane = "session"
layer = "none"
source = "specs/exceptions/A3-plan-cache/spec.md §6 决定 1–3、§4；docs/compatibility.md Plan cache 第 1 行；#305"
evidence = "v8.5.8 中 tidb_enable_instance_plan_cache 默认 OFF，预处理语句用会话级缓存；tidb-rs 没有会话级缓存，该变量默认 ON（各会话共享，新会话第一次 EXECUTE 就可能 last_plan_from_cache = 1）；设为 OFF 时完全不缓存（last_plan_from_cache 恒为 0）；会话级缓存的变量照常接受、不起作用"
rationale = "特性例外：负责人决定只做实例级缓存（#128），默认 ON 才能保留 Go 默认的预处理语句命中缓存"
approver = "zhigang-du"
approved = "2026-11-23"
reopen = "tidb-rs 实现会话级缓存，或混合集群中默认值不一致造成问题，或负责人改变决定"

