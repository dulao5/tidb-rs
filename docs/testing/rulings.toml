[[ruling]]
id = "R28"
name = "window-range-compound-decimal-interval"
class = "divergence"
plane = "rows"
layer = "none"
test = "crates/planner/src/core/logical_plan_builder.rs::window_range_compound_decimal_interval_uses_decimal_date_func"
source = "Constitution Article 9.1 (owner decision 2026-11-26, option A); D09.4 spec §7 item 7, §8 item 5, §9.1 item 2; #413"
evidence = "In Go TiDB v8.5.8, buildWindowFunctionFrameBound (pkg/planner/core/logical_plan_builder.go:7042) builds expression.Constant{Value: val, RetType: boundClause.Expr.GetType()} for RANGE INTERVAL bounds. For a compound decimal expression such as INTERVAL 1.0+0.5 DAY, evalAstExprWithPlanCtx produces Decimal(1.5), but boundClause.Expr.GetType() is a zero-value FieldType (TypeUnspecified == 0), whose EvalType() is ETString (pkg/parser/types/field_type.go:429-453). DateSub/DateAdd (pkg/expression/builtin_time.go:3592-3597) keeps ETString and selects SubDateDatetimeString/AddDateDatetimeString, which casts \"1.5\" to string and truncates it to 1 day (returning 6 instead of 7 on {('2024-01-01',1),('2024-01-02',2),('2024-01-03',4)}, while literal INTERVAL 1.5 DAY and DATE_SUB('2024-01-03', INTERVAL 1.0+0.5 DAY) round to 2 days and return 7, with identical EXPLAIN text). Strictly for compound decimal INTERVAL bounds (excluding numeric RANGE bounds, non-decimal INTERVALs, parenthesized literals, and parameter markers), tidb-rs derives Constant.RetType from the evaluated Datum (KindMysqlDecimal -> TypeNewDecimal, EvalType == ETDecimal) so DateSub/DateAdd selects SubDateDatetimeDecimal/AddDateDatetimeDecimal (2 days)."
rationale = "Owner decision (2026-11-26, option A on #413): eliminates silent wrong rows inconsistent with EXPLAIN, DATE_SUB, and literal INTERVAL 1.5 DAY. Neither Go's SubDateDatetimeString/AddDateDatetimeString nor tidb-rs's SubDateDatetimeDecimal/AddDateDatetimeDecimal is in the TiFlash pushdown allowlist (pkg/expression/infer_pushdown.go:356-364), so Go does not push these windows to TiFlash either and R28 incurs no TiFlash pushdown regression."
approver = "zhigang-du"
approved = "2026-11-26"
reopen = "Baseline upgraded to a Go TiDB version that derives Constant.RetType from the evaluated Datum for compound decimal INTERVAL bounds in buildWindowFunctionFrameBound, or owner changes the decision; add layer/unit/stmt if ab tests hit it once D08.7 date arithmetic and window execution are wired."

