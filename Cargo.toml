[workspace]
resolver = "2"
members = [
  "crates/poc/server",
  "crates/mysql-protocol",
  "crates/parser",
  "crates/query-smoke",
  "crates/poc/kv",
  "crates/meta",
  "crates/distsql",
  "crates/sql",
  "crates/poc/executor",
  "crates/poc/session",
  "crates/poc/domain",
  "crates/metrics",
  "crates/types",
  "crates/base",
  "crates/runtime",
  "crates/memory",
  "crates/model",
  "crates/chunk",
  "crates/kv",
  "crates/codec",
  "crates/tablecodec",
  "crates/sessionctx",
  "crates/systable",
  "crates/expression",
  "crates/expression/macros",
  "crates/execdetails",
  "crates/infoschema",
  # SPIKE (D09.7 design pilot for N1): not for merging, not counted in coverage.
  "crates/spike/planner-pilot",
  "tools/ab",
  # TiKV's TiDB-query crates, vendored unmodified (see third_party/tikv/PROVENANCE.md).
  # They do not opt into [workspace.lints] and are not formatted or linted by our checks.
  "third_party/tikv/codec",
  "third_party/tikv/collections",
  "third_party/tikv/error_code",
  "third_party/tikv/panic_hook",
  "third_party/tikv/profiler",
  "third_party/tikv/tidb_query_aggr",
  "third_party/tikv/tidb_query_codegen",
  "third_party/tikv/tidb_query_common",
  "third_party/tikv/tidb_query_datatype",
  "third_party/tikv/tidb_query_expr",
  "third_party/tikv/tipb_helper",
  # Stand-ins for TiKV-internal crates the vendored crates depend on.
  "third_party/tikv-shims/*",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Style lints a faithful Go port may allow, module-wide (`#![allow(...)]`) in a ported file:
# they would rewrite Go's expressions and control flow (`x+1 <= n` -> `x < n`, index loops
# -> iterators, late initialisation in branches, struct-update syntax), and the port keeps
# Go's form for side-by-side review. Correctness lints are never allowed module-wide.
# Cargo's [lints] cannot target modules, so this is the one list; scripts/converge.py checks
# that every ported file's `#![allow]` is a subset of it (docs/porting/mappings.md, "lint").
[workspace.metadata.porting]
style-lint-allow = [
  "clippy::int_plus_one",
  "clippy::field_reassign_with_default",
  "clippy::needless_late_init",
  "clippy::manual_range_contains",
  "clippy::manual_slice_fill",
  "clippy::needless_range_loop",
  # Go identifiers kept for constants, statics and tables (mapping rule M-GONAME:
  # `mysql::ErrDupEntry`); functions and types follow Rust naming.
  "non_upper_case_globals",
]

# The vendored TiKV crates refer to these with `{ workspace = true }`. Specs
# follow TiKV's root Cargo.toml.
[workspace.dependencies]
# Vendored TiKV crates.
codec = { path = "third_party/tikv/codec" }
collections = { path = "third_party/tikv/collections" }
error_code = { path = "third_party/tikv/error_code" }
panic_hook = { path = "third_party/tikv/panic_hook" }
profiler = { path = "third_party/tikv/profiler" }
tidb_query_aggr = { path = "third_party/tikv/tidb_query_aggr" }
tidb_query_codegen = { path = "third_party/tikv/tidb_query_codegen" }
tidb_query_common = { path = "third_party/tikv/tidb_query_common" }
tidb_query_datatype = { path = "third_party/tikv/tidb_query_datatype" }
tidb_query_expr = { path = "third_party/tikv/tidb_query_expr" }
tipb_helper = { path = "third_party/tikv/tipb_helper" }
# Shims for TiKV-internal crates.
api_version = { path = "third_party/tikv-shims/api_version" }
crypto = { path = "third_party/tikv-shims/crypto" }
file_system = { path = "third_party/tikv-shims/file_system" }
log_wrappers = { path = "third_party/tikv-shims/log_wrappers" }
tikv_alloc = { path = "third_party/tikv-shims/tikv_alloc" }
tikv_util = { path = "third_party/tikv-shims/tikv_util" }
tracker = { path = "third_party/tikv-shims/tracker" }
# First-party crates.
tidb-distsql = { path = "crates/distsql" }
poc-domain = { path = "crates/poc/domain" }
poc-kv = { path = "crates/poc/kv" }
tidb-meta = { path = "crates/meta" }
tidb-metrics = { path = "crates/metrics" }
tidb-mysql-protocol = { path = "crates/mysql-protocol" }
tidb-parser = { path = "crates/parser" }
tidb-sql = { path = "crates/sql" }
poc-executor = { path = "crates/poc/executor" }
poc-session = { path = "crates/poc/session" }
tidb-types = { path = "crates/types" }
tidb-base = { path = "crates/base" }
tidb-runtime = { path = "crates/runtime" }
tidb-memory = { path = "crates/memory" }
tidb-model = { path = "crates/model" }
tidb-chunk = { path = "crates/chunk" }
tidb-kv = { path = "crates/kv" }
tidb-codec = { path = "crates/codec" }
tidb-tablecodec = { path = "crates/tablecodec" }
tidb-execdetails = { path = "crates/execdetails" }
tidb-infoschema = { path = "crates/infoschema" }
tidb-sessionctx = { path = "crates/sessionctx" }
tidb-systable = { path = "crates/systable" }
tidb-expression = { path = "crates/expression" }
tidb-expression-macros = { path = "crates/expression/macros" }
# TiKV Rust client: our fork (dulao5/client-rust, branch tidb-rs/metrics): `Snapshot::coprocessor`,
# several connections per store, client-go/PD metrics (feature client-go-metrics), and
# client-go's lock resolution (#101 R1-R7, R12: lock hints, background cleanup,
# TTL-capped lock backoff, shared lock wrappers in the coprocessor, lite resolve, shared
# status cache, collapsed region resolves, low-resolution timestamp, refresh-round guard),
# no gRPC receive limit (P0-3 of specs/D07.1-store/client-go-parity.md), and client-go's
# Backoffer: one 20 s time budget per read shared by its retries, lock resolution and lock
# waits, per-error curves, ServerIsBusy excluded (P0-1a, P0-1b); the longest-slept error kind
# when a budget runs out; client-go's per-request RPC timeouts and deadlines, and
# `tikv_client_read_timeout` (P0-2); a broken TSO stream is reopened and its requests resent
# (P0-4).
tikv-client = { git = "https://github.com/dulao5/client-rust.git", rev = "36068d0b4514d3a5562ea1d3dc15ef4ef11c3543", default-features = false, features = ["client-go-metrics"] }
# External crates.
bytes = "1.11"
# Global allocator of the server and the benchmarks (A1 / P0 decision D7: jemalloc).
tikv-jemallocator = "0.6"
chrono = { version = "0.4", default-features = false }
futures = "0.3"
heck = "0.3"
kvproto = { git = "https://github.com/pingcap/kvproto.git" }
openssl = "0.10.80"
protobuf = "2.8"
raft = { version = "0.7.0", default-features = false, features = ["protobuf-codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slog = { version = "2.3", features = ["max_level_trace", "release_max_level_debug"] }
slog-global = { version = "0.1", git = "https://github.com/tikv/slog-global.git", rev = "d592f88e4dbba5eb439998463054f1a44fbf17b9" }
thiserror = "1.0"
time = { version = "0.2.23" }
tipb = { git = "https://github.com/pingcap/tipb.git" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
yatp = { git = "https://github.com/tikv/yatp.git", branch = "master" }

# Same patches as TiKV; Cargo.lock pins the git revisions TiKV's lock uses.
[patch.crates-io]
# tipb (and kvproto) are generated for PingCAP's rust-protobuf 2.8 fork.
protobuf = { git = "https://github.com/pingcap/rust-protobuf", branch = "v2.8" }
protobuf-codegen = { git = "https://github.com/pingcap/rust-protobuf", branch = "v2.8" }
# Only resolved, never built here (optional deps of error_code/tidb_query_common).
raft = { git = "https://github.com/tikv/raft-rs", branch = "master" }
raft-proto = { git = "https://github.com/tikv/raft-rs", branch = "master" }

[profile.dev.build-override]
# Parser table generation runs in build.rs; unoptimised it is very slow.
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Optimised, but integer overflow panics as in debug builds. CI runs the Go-ported crates'
# tests (vector replay, overflow fuzz) under it as well: a wrap Go relies on must be written
# wrapping_* (mapping rule M-INT), and optimisation must not hide a missed one.
[profile.release-checked]
inherits = "release"
overflow-checks = true
