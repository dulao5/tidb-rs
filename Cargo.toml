[workspace]
resolver = "2"
members = ["crates/server", "crates/parser"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.build-override]
# Parser table generation runs in build.rs; unoptimised it is very slow.
opt-level = 3

[profile.release.build-override]
opt-level = 3
